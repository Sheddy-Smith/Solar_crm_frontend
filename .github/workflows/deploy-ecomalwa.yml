# Instant deploy on push to main when VPS SSH secrets exist.
# Without secrets the job no-ops; the VPS systemd timer still deploys within ~1 min.
name: Deploy ecomalwa

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ecomalwa
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Detect SSH deploy secrets
        id: check
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          if [ -n "$VPS_SSH_KEY" ] && [ -n "$VPS_HOST" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No VPS_SSH_KEY/VPS_HOST secrets — skipping instant SSH deploy."
            echo "VPS timer will still pull main and deploy FE+BE within ~1 minute."
          fi

      - name: Trigger remote auto-deploy now
        if: steps.check.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            export FORCE=1
            /usr/local/bin/malwa-crm-auto-deploy.sh
