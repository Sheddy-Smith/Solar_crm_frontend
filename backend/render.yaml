# Backend-only Render Blueprint (copy lives in lab: solar_crm_backend)
services:
  - type: web
    name: malwa-solar-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn malwa_solar.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --worker-class gthread --threads 4
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: malwa_solar.settings.production
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
