<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#0d9f4a" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#07070d" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="index,follow" />
    <meta
      name="description"
      content="Malwa Solar CRM for lead management, follow-ups, project coordination, inventory, and solar business operations."
    />
    <meta property="og:title" content="Malwa Solar CRM" />
    <meta
      property="og:description"
      content="Professional solar CRM workspace for sales, project, liaisoning, accounts, and service teams."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" href="./icons/favicon.ico?v=8" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png?v=8" />
    <link rel="icon" type="image/png" sizes="16x16" href="./icons/favicon-16.png?v=8" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png?v=8" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png?v=8" />
    <link rel="manifest" href="./manifest.webmanifest?v=8" />
    <!-- Capture install prompt ASAP — Vite bundles can load after BIP fires once. -->
    <script>
      (function () {
        window.__malwaDeferredPrompt = null;
        window.addEventListener('beforeinstallprompt', function (event) {
          try { event.preventDefault(); } catch (e) {}
          window.__malwaDeferredPrompt = event;
        });
        window.addEventListener('appinstalled', function () {
          window.__malwaDeferredPrompt = null;
          try { localStorage.setItem('malwa_pwa_installed', '1'); } catch (e) {}
        });
      })();
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Malwa Solar" />
    <meta name="application-name" content="Malwa Solar" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Nunito+Sans:wght@400;600;700;800&display=swap"
    />
    <title>Malwa Solar CRM</title>
  </head>
  <body>
    <!-- Outside #root so a stuck splash cannot block React, and we can auto-recover. -->
    <div id="malwa-boot-splash" style="position:fixed;inset:0;z-index:2147482000;display:flex;align-items:center;justify-content:center;background:#f3f7fb;font-family:Arial,sans-serif;padding:24px">
      <div style="text-align:center;max-width:360px">
        <div style="color:#0d9f4a;font-size:14px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase">Malwa Solar CRM</div>
        <div id="malwa-boot-status" style="margin-top:10px;color:#1e3261;font-size:18px;font-weight:800">Loading…</div>
        <p style="margin-top:10px;color:#53647f;font-size:13px;font-weight:600;line-height:1.5">If this stays here, tap Recover once. Login data is kept.</p>
        <button type="button" id="malwa-boot-recover" onclick="window.malwaRecoverCaches&&window.malwaRecoverCaches()" style="margin-top:14px;background:#0d9f4a;color:#fff;border:0;border-radius:8px;padding:10px 18px;font-size:13px;font-weight:800">Recover offline cache</button>
      </div>
    </div>
    <div id="root"></div>
    <noscript>
      <p style="font-family:Arial,sans-serif;padding:24px;text-align:center;color:#1e3261">
        Malwa Solar CRM needs JavaScript enabled.
      </p>
    </noscript>
    <script>
      (function () {
        var AUTO_KEY = 'malwa_boot_auto_recover_at';
        function hideSplash() {
          var el = document.getElementById('malwa-boot-splash');
          if (el && el.parentNode) el.parentNode.removeChild(el);
        }
        window.malwaHideSplash = hideSplash;
        window.malwaRecoverCaches = function () {
          var status = document.getElementById('malwa-boot-status');
          if (status) status.textContent = 'Recovering…';
          var done = function () {
            var url = location.href.split('#')[0].replace(/([?&])malwa_updated=\d+/g, '').replace(/[?&]$/, '');
            var sep = url.indexOf('?') >= 0 ? '&' : '?';
            location.replace(url + sep + 'malwa_recovered=' + Date.now());
          };
          var clearCaches = function () {
            if (!window.caches) return Promise.resolve();
            return caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (k) { return caches.delete(k); }));
            });
          };
          try { localStorage.removeItem('malwa_ack_build'); } catch (e) {}
          try { sessionStorage.removeItem(AUTO_KEY); } catch (e2) {}
          if (!('serviceWorker' in navigator)) {
            clearCaches().then(done).catch(done);
            return;
          }
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(regs.map(function (r) { return r.unregister(); }));
          }).then(clearCaches).then(done).catch(done);
        };
        window.addEventListener('malwa-app-ready', hideSplash);
        // Hide splash as soon as React paints into #root.
        var root = document.getElementById('root');
        if (root && window.MutationObserver) {
          var obs = new MutationObserver(function () {
            if (root.childNodes && root.childNodes.length) {
              hideSplash();
              try { obs.disconnect(); } catch (e) {}
            }
          });
          obs.observe(root, { childList: true, subtree: true });
        }
        // Installed PWA stuck on splash: auto-recover once after 8s.
        setTimeout(function () {
          if (!document.getElementById('malwa-boot-splash')) return;
          var last = 0;
          try { last = Number(sessionStorage.getItem(AUTO_KEY) || 0); } catch (e) {}
          if (last && Date.now() - last < 60000) {
            var status = document.getElementById('malwa-boot-status');
            if (status) status.textContent = 'Still loading — tap Recover';
            return;
          }
          try { sessionStorage.setItem(AUTO_KEY, String(Date.now())); } catch (e2) {}
          window.malwaRecoverCaches();
        }, 8000);
      })();
    </script>
    <script>
      // Capture boot failures without wiping CRM auth/local data.
      // Recovery clears only Cache Storage + service workers (not localStorage).
      (function () {
        var shown = false;
        var RECOVERY_KEY = 'malwa_boot_recovery_at';

        function buildId() {
          var meta = document.querySelector('meta[name="malwa-build-id"]');
          return (meta && meta.getAttribute('content')) || 'unknown';
        }

        function showBootError(detail) {
          if (shown) return;
          shown = true;
          var root = document.getElementById('root');
          if (!root) return;
          try {
            console.error('[Malwa boot]', detail);
          } catch (e) {}
          var safeDetail = String(detail || 'Unknown startup error').slice(0, 500);
          root.setAttribute('data-boot-error', '1');
          root.innerHTML =
            '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f3f7fb;font-family:Arial,sans-serif;padding:24px">' +
            '<div style="max-width:540px;text-align:left">' +
            '<h1 style="color:#1e3261;font-size:22px;font-weight:800;margin:0 0 10px;text-align:center">Malwa Solar could not start</h1>' +
            '<p style="color:#53647f;font-size:14px;font-weight:600;line-height:1.6;margin:0 0 12px;text-align:center">' +
            'Usually an outdated offline cache or a System WebView older than Chrome 61. Tap recovery once — login data is kept. If it still fails, update Chrome / Android System WebView from Play Store.' +
            '</p>' +
            '<pre style="background:#fff;border:1px solid #d9e2ec;border-radius:8px;padding:12px;font-size:11px;color:#b91c1c;white-space:pre-wrap;word-break:break-word;margin:0 0 16px">' +
            safeDetail.replace(/</g, '&lt;') +
            '\\nbuild: ' + buildId() +
            '</pre>' +
            '<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">' +
            '<button id="malwa-recover-cache" style="background:#0d9f4a;color:#fff;border:none;border-radius:8px;padding:10px 20px;font-size:14px;font-weight:700">Recover offline cache</button>' +
            '<button id="malwa-reload-once" style="background:#fff;color:#1e3261;border:1px solid #d9e2ec;border-radius:8px;padding:10px 20px;font-size:14px;font-weight:700">Reload</button>' +
            '</div></div></div>';

          var recover = document.getElementById('malwa-recover-cache');
          var reload = document.getElementById('malwa-reload-once');
          if (reload) {
            reload.onclick = function () { location.reload(); };
          }
          if (recover) {
            recover.onclick = function () {
              var last = 0;
              try { last = Number(sessionStorage.getItem(RECOVERY_KEY) || 0); } catch (e) {}
              if (last && Date.now() - last < 15000) {
                alert('Recovery already tried. Open Chrome, update it from Play Store, then reopen Malwa Solar.');
                return;
              }
              try { sessionStorage.setItem(RECOVERY_KEY, String(Date.now())); } catch (e) {}
              var done = function () { location.reload(); };
              // Only unregister SW + delete Cache Storage. Never touch localStorage/session CRM data.
              var clearCaches = function () {
                if (!window.caches) return Promise.resolve();
                return caches.keys().then(function (keys) {
                  return Promise.all(keys.map(function (k) { return caches.delete(k); }));
                });
              };
              if (!('serviceWorker' in navigator)) {
                clearCaches().then(done).catch(done);
                return;
              }
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(regs.map(function (r) { return r.unregister(); }));
              }).then(clearCaches).then(done).catch(done);
            };
          }
        }

        window.addEventListener('error', function (event) {
          var msg = (event && event.message) || '';
          var isSyntax = msg.indexOf('Unexpected token') !== -1 || msg.indexOf('SyntaxError') !== -1;
          var isChunk = msg.indexOf('Loading chunk') !== -1 || msg.indexOf('Failed to fetch') !== -1;
          if (!isSyntax && !isChunk) return;
          var file = (event && (event.filename || (event.target && event.target.src))) || '';
          var line = event && event.lineno ? (':' + event.lineno + ':' + (event.colno || 0)) : '';
          showBootError(msg + (file ? '\\n' + file + line : ''));
        });

        window.addEventListener('unhandledrejection', function (event) {
          var reason = event && event.reason;
          var msg = reason && (reason.message || String(reason)) || 'Unhandled promise rejection';
          if (String(msg).indexOf('Loading CSS chunk') === -1 && String(msg).indexOf('Failed to fetch dynamically imported module') === -1) return;
          showBootError(String(msg));
        });
      })();
    </script>
    <script>
      // Early update gate (classic JS / Chrome 61 safe) for already-installed TWA/PWA.
      // Show Update CRM when live version.json buildId !== last acknowledged build
      // (not only when HTML shell is stale — network-first often loads new HTML silently).
      (function () {
        var DISMISS_KEY = 'malwa_update_dismissed_';
        var ACK_BUILD_KEY = 'malwa_ack_build';
        var ACK_RELEASE_KEY = 'malwa_ack_release';
        var overlayId = 'malwa-early-update';

        function shellBuild() {
          var meta = document.querySelector('meta[name="malwa-build-id"]');
          return (meta && meta.getAttribute('content')) || '';
        }

        function shellRelease() {
          var meta = document.querySelector('meta[name="malwa-release-version"]');
          return (meta && meta.getAttribute('content')) || '';
        }

        function ackedBuild() {
          try { return localStorage.getItem(ACK_BUILD_KEY) || ''; } catch (e) { return ''; }
        }

        function ackedRelease() {
          try { return localStorage.getItem(ACK_RELEASE_KEY) || ''; } catch (e) { return ''; }
        }

        function setAck(buildId, releaseVersion) {
          try {
            localStorage.setItem(ACK_BUILD_KEY, buildId);
            if (releaseVersion) localStorage.setItem(ACK_RELEASE_KEY, releaseVersion);
          } catch (e) {}
        }

        function dismissed(id) {
          try { return sessionStorage.getItem(DISMISS_KEY + id) === '1'; } catch (e) { return false; }
        }

        function markDismissed(id) {
          try { sessionStorage.setItem(DISMISS_KEY + id, '1'); } catch (e) {}
        }

        function activateWaitingWorkers() {
          if (!('serviceWorker' in navigator)) return Promise.resolve();
          return navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (reg) {
              try { if (reg.update) reg.update(); } catch (e) {}
              if (reg.waiting) {
                try { reg.waiting.postMessage({ type: 'SKIP_WAITING' }); } catch (e2) {}
              }
            });
          }).catch(function () {});
        }

        function applyUpdate(remote) {
          if (remote && remote.buildId) setAck(remote.buildId, remote.releaseVersion || '');
          activateWaitingWorkers().then(function () {
            var clear = Promise.resolve();
            if (window.caches) {
              clear = caches.keys().then(function (keys) {
                return Promise.all(keys.filter(function (k) {
                  return k.indexOf('malwa-solar-crm-') === 0;
                }).map(function (k) { return caches.delete(k); }));
              });
            }
            return clear;
          }).then(function () {
            var url = location.href.split('#')[0].replace(/([?&])malwa_updated=\d+/g, '').replace(/[?&]$/, '');
            var sep = url.indexOf('?') >= 0 ? '&' : '?';
            location.replace(url + sep + 'malwa_updated=' + Date.now());
          }).catch(function () {
            location.reload();
          });
        }

        function showOverlay(remote) {
          if (document.getElementById(overlayId)) return;
          if (window.__MALWA_REACT_UPDATE_UI__) return;
          var prevRel = ackedRelease() || shellRelease() || '—';
          var prevBuild = ackedBuild() || shellBuild() || 'old';
          var wrap = document.createElement('div');
          wrap.id = overlayId;
          wrap.setAttribute('role', 'dialog');
          wrap.style.cssText = 'position:fixed;inset:0;z-index:2147483000;display:flex;align-items:flex-end;justify-content:center;padding:12px;background:rgba(11,26,51,0.55);font-family:Arial,sans-serif';
          wrap.innerHTML =
            '<div style="width:100%;max-width:420px;background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 24px 60px rgba(15,39,92,0.28)">' +
            '<div style="background:linear-gradient(90deg,#0d9f4a,#0b7a39);color:#fff;padding:16px 20px">' +
            '<div style="font-size:11px;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;opacity:0.9">Malwa Solar CRM</div>' +
            '<div style="font-size:20px;font-weight:800;margin-top:4px">Software Update</div></div>' +
            '<div style="padding:20px">' +
            '<div style="color:#0d9f4a;font-size:12px;font-weight:800;text-transform:uppercase">New version</div>' +
            '<div style="color:#1e3261;font-size:15px;font-weight:700;margin-top:6px">A new version of Malwa Solar CRM is available!</div>' +
            '<div style="color:#53647f;font-size:13px;font-weight:600;line-height:1.5;margin-top:8px">' +
            String(remote.releaseNotes || 'Latest improvements, bug fixes aur performance updates paane ke liye CRM update karein.').replace(/</g, '&lt;') +
            '</div>' +
            '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;padding:12px;border:1px solid #e4edf7;border-radius:12px;background:#f6f9fc">' +
            '<div><div style="font-size:10px;font-weight:700;color:#7585a2;text-transform:uppercase">Current</div>' +
            '<div style="font-size:15px;font-weight:800;color:#1e3261">' + prevRel + '</div>' +
            '<div style="font-size:10px;color:#94a3b8">build ' + prevBuild + '</div></div>' +
            '<div><div style="font-size:10px;font-weight:700;color:#7585a2;text-transform:uppercase">Latest</div>' +
            '<div style="font-size:15px;font-weight:800;color:#0d9f4a">' + (remote.releaseVersion || remote.buildId) + '</div>' +
            '<div style="font-size:10px;color:#94a3b8">build ' + remote.buildId + '</div></div></div>' +
            '<div style="color:#53647f;font-size:12px;font-weight:600;margin-top:12px">Naye files load honge; saved CRM data / login delete nahi hoga. APK reinstall zaroori nahi.</div>' +
            '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap">' +
            '<button type="button" id="malwa-upd-later" style="height:44px;padding:0 16px;border-radius:10px;border:1px solid #d9e4f2;background:#fff;color:#1e3261;font-size:14px;font-weight:800">Later</button>' +
            '<button type="button" id="malwa-upd-now" style="height:44px;padding:0 18px;border-radius:10px;border:none;background:#0d9f4a;color:#fff;font-size:14px;font-weight:800">Update CRM</button>' +
            '</div></div></div>';
          document.body.appendChild(wrap);
          document.getElementById('malwa-upd-later').onclick = function () {
            markDismissed(remote.buildId);
            wrap.parentNode && wrap.parentNode.removeChild(wrap);
          };
          document.getElementById('malwa-upd-now').onclick = function () {
            applyUpdate(remote);
          };
        }

        function check() {
          if (window.__MALWA_REACT_UPDATE_UI__) return;
          fetch('./version.json?t=' + Date.now(), { cache: 'no-store' })
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (v) {
              if (!v || !v.buildId) return;
              if (dismissed(v.buildId)) return;
              var acked = ackedBuild();
              var shell = shellBuild();
              // First boot: remember shell quietly — avoids blank full-screen update sheet.
              if (!acked) {
                setAck(shell || v.buildId, shellRelease() || v.releaseVersion || '');
                if (!shell || shell === v.buildId) return;
              }
              if (v.buildId === ackedBuild()) return;
              showOverlay(v);
              activateWaitingWorkers();
            })
            .catch(function () {});
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', function () { setTimeout(check, 300); });
        } else {
          setTimeout(check, 300);
        }
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'visible') check();
        });
        window.addEventListener('online', check);
        window.addEventListener('pageshow', check);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
