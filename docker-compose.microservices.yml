    ports: ["8010:8010"]

  amc:
    <<: *service-build
    environment:
      <<: *backend-env
      MALWA_SERVICE_NAME: amc
      MALWA_SERVICE_PORT: "8011"
    ports: ["8011:8011"]

  tasks:
    <<: *service-build
    environment:
      <<: *backend-env
      MALWA_SERVICE_NAME: tasks
      MALWA_SERVICE_PORT: "8012"
    ports: ["8012:8012"]

  insights:
    <<: *service-build
    environment:
      <<: *backend-env
      MALWA_SERVICE_NAME: insights
      MALWA_SERVICE_PORT: "8013"
    ports: ["8013:8013"]

  reports:
    <<: *service-build
